const SUPABASE_URL = 'https://xfwxgviomkamxqsfhvow.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tSxo17j-CvZGLeO67zkTuw_oV5Kz8-L';

const isNum = v => typeof v === 'number' && !Number.isNaN(v);
const toNum = v => (v === '' || v === null || v === undefined) ? null : Number(String(v).replace(',', '.'));
const fmt = n => isNum(n) ? String(Math.round(n * 100) / 100).replace('.', ',') : '';

  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },

};

/* ---------- Suche: findet Wortteile überall, alle Suchwörter in beliebiger Reihenfolge, Umlaute und Schweizer Varianten ---------- */
const normText = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, ' ').trim();
const VARIANTEN = [
  ['schoko', 'schoggi', 'choco', 'schokolade', 'chocolat', 'cioccolat'], ['joghurt', 'jogurt', 'yoghurt', 'yogurt'], ['guetzli', 'guezli', 'keks', 'biscuit', 'cookie'],
  ['ruebli', 'karotte', 'moehre'], ['rahm', 'sahne', 'creme'], ['poulet', 'huhn', 'haehnchen', 'chicken'], ['zucchetti', 'zucchini'], ['peperoni', 'paprika'],
  ['kartoffel', 'erdapfel', 'herdopfel'], ['broetchen', 'brötli', 'semmel', 'weggli'], ['wc papier', 'toilettenpapier', 'klopapier'], ['nuesse', 'nuss'],
  ['fleischkaese', 'leberkaese'], ['glace', 'eis', 'glace'], ['konfituere', 'marmelade', 'konfi'], ['muesli', 'musli', 'muesli', 'granola'],
].map(g => g.map(normText));
function suchMuster(q) {
  return normText(q).split(' ').filter(Boolean).map(w => {
    const g = VARIANTEN.find(v => v.some(x => x.startsWith(w) || w.startsWith(x)));
    return g ? [w, ...g.filter(x => x.length >= 4)] : [w];
  });
}
function passtSuche(text, muster) {
  if (!muster.length) return true;
  const t = normText(text);
  return muster.every(alternativen => alternativen.some(w => t.includes(w)));
}

/* ---------- Datenzugriff (Supabase REST) ---------- */
function restApi(tokenHolen) {
  const base = SUPABASE_URL + '/rest/v1/';
  async function call(method, path, body, prefer) {
    const token = await tokenHolen();
    const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    if (prefer) headers.Prefer = prefer;
    const res = await fetch(base + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    if (!res.ok) {
      let msg = res.status + '';
      try { const j = await res.json(); msg = j.message || j.hint || msg; } catch (e) {}
      const err = new Error(msg); err.status = res.status; throw err;
    }
    if (res.status === 204) return null;
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }
  return {
    artikel: () => call('GET', 'artikel?select=*&aktiv=eq.true&order=name.asc'),
    artikelNeu: obj => call('POST', 'artikel', obj, 'return=representation').then(r => r[0]),
    artikelAendern: (id, obj) => call('PATCH', 'artikel?id=eq.' + id, obj, 'return=representation').then(r => r[0]),
    offenerEinkauf: () => call('GET', 'einkauf?select=*&abgeschlossen_am=is.null&order=id.desc&limit=1').then(r => r[0] || null),
    einkaufNeu: () => call('POST', 'einkauf', {}, 'return=representation').then(r => r[0]),
    einkaufAbschliessen: id => call('PATCH', 'einkauf?id=eq.' + id, { abgeschlossen_am: new Date().toISOString() }),
    einkaufErledigt: (id, ja) => call('PATCH', 'einkauf?id=eq.' + id, { erledigt_am: ja ? new Date().toISOString() : null }, 'return=representation').then(r => r[0]),
    positionen: eid => call('GET', 'einkauf_position?select=*&einkauf_id=eq.' + eid + '&order=id.asc'),
    positionNeu: obj => call('POST', 'einkauf_position', obj, 'return=representation').then(r => r[0]),
    positionAendern: (id, obj) => call('PATCH', 'einkauf_position?id=eq.' + id, obj, 'return=representation').then(r => r[0]),
    positionLoeschen: id => call('DELETE', 'einkauf_position?id=eq.' + id),
    fruehereZusatz: () => call('GET', 'einkauf_position?select=freitext,kategorie,laden&freitext=not.is.null&order=id.desc&limit=300'),
    meinProfil: uid => call('GET', 'benutzer?select=*&id=eq.' + uid).then(r => r[0] || null),
    benutzer: () => call('GET', 'benutzer?select=*&order=erstellt_am.asc'),
    benutzerRolle: (id, rolle) => call('PATCH', 'benutzer?id=eq.' + id, { rolle }, 'return=representation').then(r => r[0]),
    benutzerLoeschen: id => call('DELETE', 'benutzer?id=eq.' + id),
    aktionen: () => call('GET', 'aktion_aktuell?select=*&order=laden.asc,name.asc'),
    verlauf: () => call('GET', 'einkauf_position?select=artikel_id,freitext,kategorie,laden,menge_fix,menge_gekauft,einkauf_id,einkauf!inner(abgeschlossen_am)&gekauft=is.true&einkauf.abgeschlossen_am=not.is.null&order=id.desc&limit=3000'),
    aktionenAktualisieren: async () => {
      const token = await tokenHolen();
      const res = await fetch(SUPABASE_URL + '/functions/v1/aktionen-holen', { method: 'POST', headers: { Authorization: 'Bearer ' + token, apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: '{}' });
      if (!res.ok) throw new Error('Abruf fehlgeschlagen (' + res.status + ')');
      return res.json();
    },
  };
}

/* ---------- Zustand ---------- */
const S = {
  api: null, artikel: [], einkauf: null, pos: [], frueher: [],
  tab: 'einkaufen', vListe: 'vorrat', suche: '', filter: 'alle', laden: 'alle', ekLaden: 'alle', ekSuche: '', aktionen: [], akLaden: 'Denner', akWoche: 0, akSuche: '', akFilter: 'alle',
};
const posFor = id => S.pos.find(p => p.artikel_id === id);
const artById = id => S.artikel.find(a => a.id === id);
// Kategorien wie bei Denner (Lebensmittel, Getränke, Non-Food), in dieser Reihenfolge
const KATEGORIEN = ['Früchte und Gemüse', 'Fleisch/Wurst/Fisch', 'Milch/Käse/Eier', 'Brot/Backwaren', 'Fertigprodukte', 'Tiefkühlprodukte',
  'Sonstiges', 'Schokolade/Süsses', 'Snack/Apero', 'Kaffee/Tee/Kakao', 'Getränke/Säfte', 'Bier', 'Wein/Champagner',
  'Pflege/Kosmetik', 'Waschen/Haushalt', 'Andere'];
const NON_FOOD = new Set(['Pflege/Kosmetik', 'Waschen/Haushalt', 'Andere']);
const katRang = k => { const i = KATEGORIEN.indexOf(k); return i < 0 ? KATEGORIEN.length : i; };
const katSort = (x, y) => katRang(x) - katRang(y) || coll.compare(x || 'zzz', y || 'zzz');
const kategorien = () => [...new Set(KATEGORIEN.concat(S.artikel.map(a => a.kategorie).filter(Boolean), S.pos.map(p => p.kategorie).filter(Boolean)))].sort(katSort);
// Ordnet eine Ladenkategorie (Migros, Lidl, alte eigene) einer Denner-Kategorie zu
function dennerKategorie(kat, name) {
  const k = String(kat || '').toLowerCase(), n = String(name || '').toLowerCase();
  if (KATEGORIEN.includes(kat)) return kat;
  const r = [
    [/tierbedarf|katzen|hunde|bekleidung|mode|spiel|hobby|garten|deko|wohn|schlaf|küche & wohn|küchenger|multimedia|elektro|papeterie|blumen|heizen|sport|kinderzimmer|werkzeug|hidden/, 'Andere'],
    [/beauty|gesundheit|pflege|kosmetik|zahn|badezimmer|baby und kind/, 'Pflege/Kosmetik'],
    [/reinigung|wasch|haushalt|hygienepapier/, 'Waschen/Haushalt'],
    [/tiefkühl|glace/, 'Tiefkühlprodukte'],
    [/^wein, bier/, /bier|lager|ale\b|cider/.test(n) ? 'Bier' : 'Wein/Champagner'],
    [/bier|cider/, 'Bier'],
    [/(rot|weiss|weiß|rosé|schaum)wein|^wein|weinpaket|champagner|sekt|prosecco|spirituos/, 'Wein/Champagner'],
    [/^getränke, kaffee/, /kaffee|tee\b|tee |kakao|espresso|caf|capsul|kapsel/.test(n) ? 'Kaffee/Tee/Kakao' : 'Getränke/Säfte'],
    [/kaffee|tee|kakao/, 'Kaffee/Tee/Kakao'],
    [/softdrink|saft|säfte|wasser|getränk/, 'Getränke/Säfte'],
    [/^snacks & süss/, /chips|nüss|nuss|apéro|apero|cracker|salzst|popcorn|flips|brezel/.test(n) ? 'Snack/Apero' : 'Schokolade/Süsses'],
    [/trockenobst|nüsse|herzhafte snacks|snack|apero/, 'Snack/Apero'],
    [/schoko|süss|süß|bonbon|fruchtgummi|kekse|dessert/, 'Schokolade/Süsses'],
    [/konserve|pasta, würz|reis|nudel|hülsen|sauce|soße|würz|gewürz|kräuter|öl|fett|essig|marmelade|aufstrich|honig|suppe|backen|teigwaren|trockenware/, 'Sonstiges'],
    [/fleisch|fisch|wurst|aufschnitt|geflügel|rind|schwein|meeresfr/, 'Fleisch/Wurst/Fisch'],
    [/früchte|gemüse|obst|frischware/, 'Früchte und Gemüse'],
    [/^milchprodukte/, /sandwich|salat|pizza|wrap|menü|lasagne|curry|bowl|suppe|ravioli|gnocchi|wähe|quiche/.test(n) ? 'Fertigprodukte' : 'Milch/Käse/Eier'],
    [/fertiggericht|feinkost|antipasti|frische pasta/, 'Fertigprodukte'],
    [/käse|milch|joghurt|butter|eier|sahne|kühlprodukte/, 'Milch/Käse/Eier'],
    [/^brot, backwaren/, /müesli|muesli|flakes|cornflakes|konfi|honig|aufstrich/.test(n) ? 'Sonstiges' : 'Brot/Backwaren'],
    [/brot|backwaren|brötchen|toast|gebäck/, 'Brot/Backwaren'],
    [/frühstück/, 'Sonstiges'],
  ];
  for (const [re, ziel] of r) if (re.test(k)) return ziel;
  return k ? 'Sonstiges' : 'Andere';
}
const katAuswahl = (id, wert) => { const w = wert ? dennerKategorie(wert) : ''; return `<select id="${id}"><option value="">– wählen –</option>${KATEGORIEN.map(k => `<option ${k === w ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>`; };
const aktionenNormalisiert = liste => liste.map(x => ({ ...x, kategorie: dennerKategorie(x.kategorie, x.name) }));

/* ---------- Einkaufslogik ---------- */
// Artikel mit im_vorrat = false sind «häufig gekauft»: nur über die Suche, ohne Bestand
const imVorrat = a => !!a && a.im_vorrat !== false;
// Grundmenge ohne Wochenanpassung
function grund(a) {
  if (a.routine) return { menge: a.routine_menge || 0, grund: 'Routine' };
  if (imVorrat(a) && isNum(a.bestand) && isNum(a.mindestbestand) && a.bestand <= a.mindestbestand)
    return { menge: a.mindestbestand - a.bestand + 1, grund: 'Nachkaufen' };
  return { menge: 0, grund: '' };
}
// Berechnet alle Zeilen der aktuellen Liste
function berechneListe() {
  const liste = [], aktion = [], entfernt = [];
  for (const a of S.artikel) {
    const p = posFor(a.id), g = grund(a);
    const laden = (p && p.laden) || a.standardladen || OHNE_LADEN;
    let menge = p && p.menge_fix != null ? p.menge_fix : g.menge + ((p && p.menge_anpassung) || 0);
    const item = { a, p, laden, menge, grund: g.grund, faellig: g.menge > 0, kategorie: a.kategorie || OHNE_KAT, name: a.name };
    if (p && p.aufnehmen === false) { if (g.menge > 0 || a.nur_aktion) entfernt.push(item); continue; }
    const aufgenommen = p && (p.aufnehmen === true || (a.nur_aktion && p.in_aktion));
    if (a.nur_aktion && !aufgenommen) { aktion.push(item); continue; }
    if (aufgenommen) { item.grund = item.grund || (a.nur_aktion ? 'Aktion' : 'Zusätzlich'); if (item.menge < 1) item.menge = 1; liste.push(item); continue; }
    if (menge > 0) liste.push(item);
  }
  for (const p of S.pos.filter(p => !p.artikel_id)) {
    liste.push({ a: null, p, laden: p.laden || OHNE_LADEN, menge: p.menge_fix || 1, grund: p.in_aktion ? 'Aktion' : 'Zusätzlich', kategorie: p.kategorie || OHNE_KAT, name: p.freitext });
  }
  return { liste, aktion, entfernt };
}

/* Position anlegen oder ändern */
async function setzePos(item, aenderung) {
  try {
    if (item.p) {
      const neu = await S.api.positionAendern(item.p.id, aenderung);
      Object.assign(item.p, neu);
    } else {
      const neu = await S.api.positionNeu(Object.assign({ einkauf_id: S.einkauf.id, artikel_id: item.a.id }, aenderung));
      S.pos.push(neu);
    }
  } catch (e) { fehler(e); }
  render();
}
async function setzeArtikel(a, aenderung) {
  try { Object.assign(a, await S.api.artikelAendern(a.id, aenderung)); } catch (e) { fehler(e); }
  render();
}

/* ---------- Rendering ---------- */
function render() {
  const root = $('#root');

  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'einkaufen';
  root.innerHTML = `
    <header>
      <div class="bar"><h1>${admin ? 'Einkauf & Vorrat' : 'Einkaufsliste'}</h1>
        <button class="iconbtn" id="neuLaden" title="Neu laden" aria-label="Neu laden">↻</button>
        <button class="iconbtn" id="menue" title="Menü" aria-label="Menü">☰</button></div>
      ${tabs.length ? `<div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab${k === 'einkaufen' ? ' tab-einkaufen' : ''}" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${t}</button>`).join('')}</div>` : ''}
    </header>
    <main id="main"></main>`;
  root.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; window.scrollTo(0, 0); render(); });
  $('#neuLaden').onclick = () => laden();
  $('#menue').onclick = menue;
  const main = $('#main');
  if (S.tab === 'einkaufen') renderEinkaufen(main);
  else if (S.tab === 'aktionen') renderAktionen(main);
  else renderArtikel(main);
  window.scrollTo(0, y);
}

function ladenPill(l) { return l === OHNE_LADEN ? `<span class="pill">${OHNE_LADEN}</span>` : `<span class="pill ${esc(l)}">${esc(l)}</span>`; }
function ladenSelect(cur, cls = 'laden') {
  return `<select class="${cls}" aria-label="Laden">${(cur === OHNE_LADEN ? [OHNE_LADEN] : []).concat(LAEDEN).map(l => `<option ${l === cur ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
function gruppiere(items, key) {
  const m = new Map();
  for (const it of items) { const k = key(it); if (!m.has(k)) m.set(k, []); m.get(k).push(it); }
  return m;
}

/* ===== Einkaufsliste ===== */
function vorratText(a) {
  if (!imVorrat(a)) return '';
  const b = isNum(a.bestand) ? fmt(a.bestand) : '?';
  const unter = isNum(a.bestand) && isNum(a.mindestbestand) && a.bestand <= a.mindestbestand;
  return `<span class="${unter ? 'tag warn' : 'tag grau'}">Vorrat ${b}${isNum(a.mindestbestand) ? ' / Min ' + fmt(a.mindestbestand) : ''}</span>`;
}

/* Hinweise oben auf der Liste (nur Admin-Ansicht) */
function hinweise(liste) {
  const na = liste.filter(i => i.p && i.p.nicht_erhaeltlich);

/* ===== Ansicht für die einkaufende Person ===== */
const gekauftAnders = i => i.p && i.p.menge_gekauft != null && i.p.menge_gekauft !== i.menge;
const gekaufteMenge = i => (i.p && i.p.menge_gekauft != null) ? i.p.menge_gekauft : i.menge;

/* ===== Lernende Vorschläge aus abgeschlossenen Einkäufen ===== */
function kaufrhythmus() {
  const m = new Map();
  for (const v of S.verlauf || []) {
    const datum = v.einkauf && v.einkauf.abgeschlossen_am; if (!datum) continue;
    const key = v.artikel_id ? 'a' + v.artikel_id : 'f' + String(v.freitext || '').toLowerCase().trim();
    if (key === 'f') continue;
    if (!m.has(key)) m.set(key, { key, artikel_id: v.artikel_id, name: v.freitext, kategorie: v.kategorie, laden: v.laden, kaeufe: new Map() });
    const e = m.get(key);
    if (!e.kaeufe.has(v.einkauf_id)) e.kaeufe.set(v.einkauf_id, { t: new Date(datum).getTime(), menge: Number(v.menge_gekauft ?? v.menge_fix ?? 1) || 1 });
  }
  const jetzt = Date.now(), TAG = 864e5;
  for (const e of m.values()) {
    const k = [...e.kaeufe.values()].sort((x, y) => x.t - y.t);
    e.anzahl = k.length; e.zuletzt = k[k.length - 1].t; e.seitTagen = Math.round((jetzt - e.zuletzt) / TAG);
    e.intervall = k.length >= 2 ? (k[k.length - 1].t - k[0].t) / (k.length - 1) / TAG : null;
    const mengen = k.map(x => x.menge).sort((x, y) => x - y); e.menge = mengen[Math.floor(mengen.length / 2)];
  }
  return m;
}
function vorschlaege(liste) {
  const auf = new Set(liste.map(i => i.a ? 'a' + i.a.id : 'f' + String(i.name).toLowerCase().trim()));
  const out = [];
  for (const e of kaufrhythmus().values()) {
    if (e.anzahl < 2 || !e.intervall || e.intervall < 3) continue;
    if (e.seitTagen < e.intervall * 0.85 || auf.has(e.key)) continue;
    if (e.artikel_id) {
      const a = artById(e.artikel_id); if (!a || a.routine) continue;
      const p = posFor(a.id); if (p && p.aufnehmen === false) continue;
      e.a = a; e.name = a.name; e.laden = a.standardladen || e.laden;
    }
    e.faellig = e.seitTagen / e.intervall;
    out.push(e);
  }
  return out.sort((x, y) => y.faellig - x.faellig).slice(0, 15);
}
const rhythmusText = e => {
  const w = e.intervall / 7;
  return `${w >= 1.5 ? `etwa alle ${Math.round(w)} Wochen` : w >= 0.75 ? 'etwa jede Woche' : `etwa alle ${Math.round(e.intervall)} Tage`} · zuletzt vor ${e.seitTagen} Tagen`;
};
function vorschlagBlock(liste) {
  const v = vorschlaege(liste);
  if (!(S.verlauf || []).length) return `<details class="card vorschlag"><summary>Vielleicht brauchst du noch …</summary><div class="rows"><div class="row"><div class="empty">Noch keine Vorschläge. Die App lernt aus jedem abgeschlossenen Einkauf, was ihr wie oft kauft, und schlägt es hier vor.</div></div></div></details>`;
  if (!v.length) return '';
  return `<details class="card vorschlag" open><summary>Vielleicht brauchst du noch … <span class="tag">${v.length}</span></summary><div class="rows">
    ${v.map(e => `<div class="row"><div class="main"><div class="name">${esc(e.name)}</div>
      <div class="meta">${e.laden ? ladenPill(e.laden) + ' ' : ''}${rhythmusText(e)}${e.a ? ' · ' + vorratText(e.a) : ''}${e.a && aktionFuer(e.a) ? ' <span class="tag aktion">in Aktion</span>' : ''}</div></div>
      <button class="btn small primary" data-vorschlag="${esc(e.key)}">+ ${fmt(e.menge)}</button></div>`).join('')}</div></details>`;
}
function verdrahteVorschlaege(main, liste) {
  const v = new Map(vorschlaege(liste).map(e => [e.key, e]));
  main.querySelectorAll('[data-vorschlag]').forEach(b => b.onclick = async () => {
    const e = v.get(b.dataset.vorschlag); if (!e) return;
    try {

      else { S.pos.push(await S.api.positionNeu({ einkauf_id: S.einkauf.id, freitext: e.name, kategorie: e.kategorie, laden: e.laden || 'Migros', menge_fix: e.menge || 1 })); render(); }

}

/* ===== Aktionen ===== */
const STOPP = new Set(['m', 'classic', 'budget', 'mbudget', 'mclassic', 'denner', 'migros', 'lidl', 'coop', 'bio', 'naturaplan', 'de', 'la', 'le', 'und', 'mit', 'ohne', 'per', 'pro', 'stk', 'stuck', 'stueck', 'g', 'kg', 'ml', 'l', 'cl', 'x', 'er', 'pack', 'big', 'alle', 'qualite', 'suisse', 'schweizer', 'schweiz', 'swiss', 'aus']);
const stamm = w => w.length > 5 ? w.replace(/(en|er|e|n|s)$/, '') : w;
const woerter = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').split(' ')
  .filter(w => w.length >= 3 && !STOPP.has(w) && !/^\d/.test(w)).map(stamm);
const heuteIso = () => new Date().toISOString().slice(0, 10);
function aktiveAktionen() { const h = heuteIso(); return S.aktionen.filter(x => !x.gueltig_bis || x.gueltig_bis >= h); }
const isoLokal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
// Nächster Einkaufstag: Donnerstag (heute, falls heute Donnerstag)
function einkaufstag() { const d = new Date(); d.setDate(d.getDate() + (4 - d.getDay() + 7) % 7); return isoLokal(d); }
const giltAm = (x, tag) => (!x.gueltig_von || x.gueltig_von <= tag) && (!x.gueltig_bis || x.gueltig_bis >= tag);
const datumLang = iso => new Date(iso + 'T12:00').toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' });
const datumKurz = iso => new Date(iso + 'T12:00').toLocaleDateString('de-CH', { day: 'numeric', month: 'numeric' });
// Passender Vorratsartikel zu einer Aktion (Wortvergleich, alle Wörter des Artikels müssen vorkommen)
function passenderArtikel(ak) {
  if (ak._match !== undefined) return ak._match;
  const w = new Set(woerter(ak.name));
  let best = null, bestScore = 0;
  for (const a of S.artikel) {
    const aw = woerter(a.name);
    if (!aw.length) continue;
    const treffer = aw.filter(x => w.has(x)).length;

// Aktionen je Laden für einen Einkaufsdonnerstag (Woche 0 = kommender, 1 = Folgewoche):

function aktionFuer(a) {

}

async function aktionMenge(ak, d) {

}

      : admin ? `Bestand${minZeigen ? ' und Minimum' : ''} mit − / + anpassen. Im orangen Feld setzt + den Artikel mit der gewünschten Anzahl auf die Einkaufsliste. Für alles andere auf den Namen tippen.
      <button class="btn small" id="minUmschalten" style="margin-left:6px">${minZeigen ? 'Minimum ausblenden' : 'Minimum einblenden'}</button>` : 'Bestand mit − / + anpassen, wenn etwas aufgebraucht oder dazugekommen ist. Das wird sofort gespeichert.'}</p>`;

  const g = gruppiere(arts.sort((x, y) => katSort(x.kategorie, y.kategorie) || coll.compare(x.name, y.name)), a => a.kategorie || OHNE_KAT);

    html += `<h2>${esc(kat)} <span class="sum">${as.length}</span></h2><div class="card">`;

        <div class="main">${admin ? '<button class="linkish" data-edit>' : '<div>'}<div class="name">${esc(a.name)}</div>
          <div class="meta">${a.standardladen ? ladenPill(a.standardladen) : '<span class="tag warn">kein Standardladen</span>'}
          ${a.routine ? ` <span class="tag">Routine ${fmt(a.routine_menge)}/Wo</span>` : ''}${a.nur_aktion ? ' <span class="tag">nur Aktion</span>' : ''}
          ${haeufig ? '' : `<span class="tag warn" data-unter ${unter ? '' : 'hidden'}>unter Minimum</span>${!minZeigen ? ` <span class="tag grau">Min ${fmt(a.mindestbestand)}</span>` : ''}`}</div>${admin ? '</button>' : '</div>'}</div>
        <div class="zaehlerzeile">${haeufig ? '' : zaehler(a, 'bestand', 'Bestand') + (minZeigen ? zaehler(a, 'mindestbestand', 'Min') : '')}${admin ? listenZaehler(a) : ''}</div>
      </div>`;
    }
    html += `</div>`;
  }
  if (admin) html += `<div class="footer-actions"><button class="btn" id="export">Tabelle exportieren (Excel/CSV)</button></div>
    <button class="btn primary fab" id="neu">+ Neuer Artikel</button>`;

  const s = $('#aSuche');

  const listeJetzt = admin ? berechneListe().liste : [];
  main.querySelectorAll('.row[data-id]').forEach(row => {

    row.querySelectorAll('.zaehler[data-feld]').forEach(z => {
      const feld = z.dataset.feld, inp = $('input', z);
      z.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
        const alt = isNum(a[feld]) ? a[feld] : 0;
        zaehlerSpeichern(a, feld, Math.max(0, alt + Number(b.dataset.d)), row);
      });

        if (v !== null && (Number.isNaN(v) || v < 0)) { toast('Bitte eine Zahl ab 0 eingeben.'); inp.value = fmt(a[feld]).replace(',', '.'); return; }
        zaehlerSpeichern(a, feld, v, row);

  const alle = $('#unterAlle'); if (alle) alle.onclick = () => unterMinAufListe(unterMinListe().filter(x => !x.aufListe).map(x => x.a));

/* Zuordnen: pro Artikel schnell festlegen, ob er im Vorrat erscheint oder nur über die Suche */
function zuordnenDialog() {
  const ov = dialog(`<h2>Vorrat oder häufig gekauft?</h2>
    <p class="sum">Häkchen = erscheint im Vorrat (mit Bestand und Minimum). Ohne Häkchen = nur über die Suche beim Zusammenstellen der Einkaufsliste. Wird sofort gespeichert.</p>
    <input class="search" id="zSuche" placeholder="Artikel suchen …" autocomplete="off">
    <div class="chips"><button class="chip" data-zf="alle" aria-pressed="true">Alle</button><button class="chip" data-zf="v" aria-pressed="false">Nur Vorrat</button><button class="chip" data-zf="h" aria-pressed="false">Nur häufig gekauft</button></div>
    <div id="zListe"></div>
    <div class="actions"><button class="btn primary" data-close>Fertig</button></div>`);
  let zf = 'alle';
  const zeige = () => {
    const m = suchMuster($('#zSuche', ov).value);
    const arts = S.artikel.filter(a => passtSuche(a.name + ' ' + (a.kategorie || ''), m) && (zf === 'alle' || (zf === 'v') === imVorrat(a)))
      .sort((x, y) => katSort(x.kategorie, y.kategorie) || coll.compare(x.name, y.name));
    let h = arts.length ? '' : '<div class="card"><div class="empty">Keine Artikel gefunden.</div></div>';
    for (const [kat, as] of gruppiere(arts, a => a.kategorie || OHNE_KAT)) {
      h += `<h3>${esc(kat)}</h3><div class="card">${as.map(a => `<label class="row" style="cursor:pointer"><input type="checkbox" class="check" data-zid="${a.id}" ${imVorrat(a) ? 'checked' : ''}>
        <div class="main"><div class="name">${esc(a.name)}</div><div class="meta" data-zmeta>${imVorrat(a) ? 'im Vorrat' : 'häufig gekauft (nur Suche)'}</div></div></label>`).join('')}</div>`;
    }
    $('#zListe', ov).innerHTML = h;
    ov.querySelectorAll('[data-zid]').forEach(cb => cb.onchange = async () => {
      const a = artById(+cb.dataset.zid), wert = cb.checked;
      cb.closest('.row').querySelector('[data-zmeta]').textContent = wert ? 'im Vorrat' : 'häufig gekauft (nur Suche)';
      try { Object.assign(a, await S.api.artikelAendern(a.id, { im_vorrat: wert })); }
      catch (e) { cb.checked = !wert; fehler(e); }
    });
  };
  $('#zSuche', ov).oninput = zeige;
  ov.querySelectorAll('[data-zf]').forEach(b => b.onclick = () => { zf = b.dataset.zf; ov.querySelectorAll('[data-zf]').forEach(x => x.setAttribute('aria-pressed', x === b)); zeige(); });
  // Beim Schliessen die Ansicht neu zeichnen
  new MutationObserver((_, obs) => { if (!ov.isConnected) { obs.disconnect(); render(); } }).observe(document.body, { childList: true });
  zeige();
}

/* Artikel anlegen / bearbeiten – alle Felder, damit die Tabelle vollständig bleibt */
function artikelDialog(a, vorlage = {}, ausPosition = null, aufListe = false) {
  const neu = !a; const v = Object.assign({ laeden: [], routine: null, nur_aktion: false, mindestbestand: 0, im_vorrat: true }, a || vorlage);
  const ov = dialog(`<h2>${neu ? 'Neuer Artikel' : 'Artikel bearbeiten'}</h2>
    <form id="aForm" novalidate>
    <div class="field"><label for="fName">Name *</label><input type="text" id="fName" value="${esc(v.name || '')}" placeholder="z. B. M-Classic Thon"></div>
    <div class="field"><label for="fKat">Kategorie *</label>${katAuswahl('fKat', v.kategorie)}</div>
    <div class="field"><div class="lbl">Erhältlich bei</div><div class="opts">${LAEDEN.map(l => `<label class="opt"><input type="checkbox" name="laeden" value="${esc(l)}" ${(v.laeden || []).includes(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div></div>
    <div class="field"><label for="fStd">Standardladen *</label><select id="fStd"><option value="">– wählen –</option>${LAEDEN.map(l => `<option ${l === v.standardladen ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <div class="hint">Dort landet der Artikel automatisch auf der Liste.</div></div>
    <div class="field"><div class="lbl">Wo erscheint der Artikel?</div><div class="opts">
      <label class="opt"><input type="radio" name="vorrat" value="ja" ${v.im_vorrat !== false ? 'checked' : ''}>Im Vorrat (mit Bestand)</label>
      <label class="opt"><input type="radio" name="vorrat" value="nein" ${v.im_vorrat === false ? 'checked' : ''}>Häufig gekauft (nur Suche)</label></div>
      <div class="hint">«Häufig gekauft» erscheint nicht im Vorrat, ist aber beim Zusammenstellen der Einkaufsliste über die Suche auffindbar.</div></div>
    <div class="field"><div class="lbl">Nur in Aktion kaufen?</div><div class="opts">
      <label class="opt"><input type="radio" name="aktion" value="nein" ${!v.nur_aktion ? 'checked' : ''}>Nein</label>
      <label class="opt"><input type="radio" name="aktion" value="ja" ${v.nur_aktion ? 'checked' : ''}>Ja</label></div></div>
    <div class="field"><div class="lbl">Routine-Einkauf? *</div><div class="opts">
      <label class="opt"><input type="radio" name="routine" value="nein" ${v.routine === false ? 'checked' : ''}>Nein</label>
      <label class="opt"><input type="radio" name="routine" value="ja" ${v.routine === true ? 'checked' : ''}>Ja, jede Woche</label></div></div>
    <div class="field" id="fRmWrap"><label for="fRm">Routine-Menge pro Woche *</label><input type="number" id="fRm" min="1" step="1" inputmode="numeric" value="${fmt(v.routine_menge)}"></div>
    <div class="two" id="fBestWrap">
      <div class="field"><label for="fBest">Bestand aktuell</label><input type="number" id="fBest" min="0" step="any" inputmode="decimal" value="${fmt(v.bestand).replace(',', '.')}"></div>
      <div class="field"><label for="fMin">Mindestbestand</label><input type="number" id="fMin" min="0" step="any" inputmode="decimal" value="${fmt(v.mindestbestand).replace(',', '.')}"></div>
    </div>
    <div class="field"><label for="fBem">Bemerkung</label><input type="text" id="fBem" value="${esc(v.bemerkung || '')}"></div>
    ${neu && !ausPosition ? `<label class="opt" style="margin-top:4px"><input type="checkbox" id="fAufListe" ${aufListe ? 'checked' : ''}>Auch gleich auf die Einkaufsliste dieser Woche</label>` : ''}
    <div class="err" id="fErr"></div>
    <div class="actions">
      ${!neu ? `<button type="button" class="btn danger" id="fDel">Löschen</button><span class="spacer"></span>` : ''}
      <button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary" id="fOk">${neu ? 'Artikel anlegen' : 'Speichern'}</button>
    </div></form>`);
  const rmWrap = $('#fRmWrap', ov);
  const sync = () => {
    rmWrap.style.display = ov.querySelector('input[name=routine]:checked')?.value === 'ja' ? '' : 'none';
    $('#fBestWrap', ov).style.display = ov.querySelector('input[name=vorrat]:checked')?.value === 'nein' ? 'none' : '';
  };
  ov.querySelectorAll('input[name=routine], input[name=vorrat]').forEach(r => r.onchange = sync); sync();
  // Standardladen gilt automatisch als "erhältlich bei"
  $('#fStd', ov).onchange = e => { const cb = ov.querySelector(`input[name=laeden][value="${e.target.value}"]`); if (cb) cb.checked = true; };

  $('#aForm', ov).onsubmit = async ev => {
    ev.preventDefault();
    const err = m => { $('#fErr', ov).textContent = m; };
    const name = $('#fName', ov).value.trim(), kategorie = $('#fKat', ov).value.trim(), standardladen = $('#fStd', ov).value;
    const routineV = ov.querySelector('input[name=routine]:checked')?.value;
    const laeden = [...ov.querySelectorAll('input[name=laeden]:checked')].map(c => c.value);
    const rm = toNum($('#fRm', ov).value), best = toNum($('#fBest', ov).value), min = toNum($('#fMin', ov).value);
    if (!name) return err('Bitte einen Namen eingeben.');
    if (S.artikel.some(x => x !== a && x.name.trim().toLowerCase() === name.toLowerCase())) return err('Diesen Artikel gibt es schon.');
    if (!kategorie) return err('Bitte eine Kategorie angeben.');
    if (!standardladen) return err('Bitte einen Standardladen wählen.');
    if (!routineV) return err('Bitte angeben, ob es ein Routine-Einkauf ist.');
    if (routineV === 'ja' && !(rm >= 1 && Number.isInteger(rm))) return err('Bitte die Routine-Menge pro Woche angeben (ganze Zahl ab 1).');
    for (const [n, x] of [['Bestand', best], ['Mindestbestand', min]]) if (x !== null && (Number.isNaN(x) || x < 0)) return err(`${n}: bitte eine Zahl ab 0.`);
    if (!laeden.includes(standardladen)) laeden.push(standardladen);
    const obj = {
      name, kategorie, standardladen, laeden: LAEDEN.filter(l => laeden.includes(l)),
      nur_aktion: ov.querySelector('input[name=aktion]:checked').value === 'ja',
      routine: routineV === 'ja', routine_menge: routineV === 'ja' ? rm : null,
      bestand: best, mindestbestand: min, bemerkung: $('#fBem', ov).value.trim() || null,
      im_vorrat: ov.querySelector('input[name=vorrat]:checked').value === 'ja',
    };
    $('#fOk', ov).disabled = true;
    try {
      if (neu) {
        const n = await S.api.artikelNeu(obj); S.artikel.push(n);
        if (ausPosition) { await S.api.positionLoeschen(ausPosition.id); S.pos = S.pos.filter(p => p !== ausPosition); }
        S.aktionen.forEach(x => { delete x._match; });
        if (ausPosition || $('#fAufListe', ov)?.checked) {
          const extra = ausPosition ? { in_aktion: !!ausPosition.in_aktion, aktion_id: ausPosition.aktion_id || null, bemerkung: ausPosition.bemerkung || null,
            laden: ausPosition.laden && ausPosition.laden !== n.standardladen ? ausPosition.laden : null } : {};
          const p = await S.api.positionNeu(Object.assign({ einkauf_id: S.einkauf.id, artikel_id: n.id, aufnehmen: true, menge_fix: ausPosition ? ausPosition.menge_fix || 1 : Math.max(1, grund(n).menge) }, extra));
          S.pos.push(p);
        }
        toast(`«${n.name}» angelegt.`);
      } else {
        Object.assign(a, await S.api.artikelAendern(a.id, obj)); toast('Gespeichert.');
      }
      ov.remove(); render();
    } catch (e) { $('#fOk', ov).disabled = false; err('Speichern fehlgeschlagen: ' + e.message); }
  };
  if (!neu) $('#fDel', ov).onclick = () => {
    const c = dialog(`<h2>«${esc(a.name)}» löschen?</h2><p>Der Artikel verschwindet aus Vorrat und Listen.</p>
      <div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn danger" id="dOk">Löschen</button></div>`);
    $('#dOk', c).onclick = async () => {
      try { await S.api.artikelAendern(a.id, { aktiv: false }); S.artikel = S.artikel.filter(x => x !== a); c.remove(); ov.remove(); toast('Gelöscht.'); render(); }
      catch (e) { fehler(e); }
    };
  };
  setTimeout(() => (neu ? $('#fName', ov) : null)?.focus(), 50);
}

function exportCsv() {
  const kopf = ['Produkt', ...LAEDEN, 'Standardladen', 'Nur in Aktion', 'Routine', 'Routine-Menge / Woche', 'Bestand aktuell', 'Mindestbestand', 'Kategorie', 'Bemerkung', 'Im Vorrat'];
  const zelle = v => { const s = v === null || v === undefined ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const zeilen = S.artikel.slice().sort((x, y) => katSort(x.kategorie, y.kategorie) || coll.compare(x.name, y.name)).map(a => [
    a.name, ...LAEDEN.map(l => (a.laeden || []).includes(l) ? 'x' : ''), a.standardladen, a.nur_aktion ? 'ja' : 'nein', a.routine ? 'ja' : 'nein',
    a.routine_menge, fmt(a.bestand), fmt(a.mindestbestand), a.kategorie, a.bemerkung, imVorrat(a) ? 'ja' : 'nein']);
  const csv = '﻿' + [kopf, ...zeilen].map(r => r.map(zelle).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url; link.download = 'vorrat-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Tabelle exportiert.');
}

/* ---------- Dialog / Toast ---------- */
function dialog(inner) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
let toastTimer;
function toast(text, aktion, fn) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(text)}</span>${aktion ? `<button>${esc(aktion)}</button>` : ''}`;
  if (aktion) $('button', t).onclick = () => { t.remove(); fn(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), aktion ? 7000 : 2500);
}
function fehler(e) {
  console.error(e);
  toast(e && e.status === 401 ? 'Zugang ungültig. Bitte den App-Link neu öffnen.' : 'Fehler beim Speichern: ' + (e && e.message || e));
}

/* ---------- Start ---------- */
async function laden() {
  try {
    const [artikel, einkaufAlt, frueher] = await Promise.all([S.api.artikel(), S.api.offenerEinkauf(), S.api.fruehereZusatz()]);
    S.artikel = artikel; S.frueher = frueher || [];
    if (S.modus !== 'einkauf') {
      try { S.aktionen = aktionenNormalisiert(await S.api.aktionen()); } catch (e) { S.aktionen = []; console.error(e); }
      try { S.verlauf = await S.api.verlauf(); } catch (e) { S.verlauf = []; console.error(e); }
    }
    S.einkauf = einkaufAlt || await S.api.einkaufNeu().catch(async () => await S.api.offenerEinkauf());
    S.pos = await S.api.positionen(S.einkauf.id);
    render();
  } catch (e) {
    if (e.status === 401) return anmelden('Deine Anmeldung ist abgelaufen. Bitte neu anmelden.');
    $('#root').innerHTML = `<div class="setup"><h1>Keine Verbindung</h1><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div>`;
  }
}

/* ---------- Anmeldung ---------- */
function anmelden(meldung) {
  $('#root').innerHTML = `<div class="setup"><img src="icon-192.png" alt="" onerror="this.remove()"><h1>Einkauf & Vorrat</h1>
    <p>${esc(meldung || 'Melde dich mit deiner E-Mail-Adresse an. Du bekommst einen Link per Mail, ein Passwort brauchst du nicht.')}</p>
    <form id="lForm" novalidate><input id="lMail" type="email" autocomplete="email" placeholder="deine@email.ch">
    <div class="err" id="lErr"></div><button class="btn primary" id="lOk">Anmelde-Link senden</button></form></div>`;
  $('#lForm').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#lMail').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return $('#lErr').textContent = 'Bitte eine gültige E-Mail-Adresse eingeben.';
    $('#lOk').disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { $('#lOk').disabled = false; return $('#lErr').textContent = /rate|second/i.test(error.message) ? 'Zu viele Versuche. Bitte einige Minuten warten.' : 'Senden fehlgeschlagen: ' + error.message; }
    $('#root').innerHTML = `<div class="setup"><h1>Mail ist unterwegs</h1><p>Wir haben einen Anmelde-Link an <b>${esc(email)}</b> geschickt. Öffne ihn auf diesem Gerät. Schau auch im Spam-Ordner nach.</p>
      <button class="btn" onclick="location.reload()">Zurück</button></div>`;
  };
}

function wartet(profil) {
  $('#root').innerHTML = `<div class="setup"><h1>Fast geschafft</h1>
    <p>Du bist als <b>${esc(profil.email)}</b> angemeldet. Ein Admin muss dich noch freischalten. Danach diese Seite neu laden.</p>
    <button class="btn primary" onclick="location.reload()">Neu laden</button>
    <button class="btn" id="abm">Abmelden</button></div>`;
  $('#abm').onclick = abmelden;
}

async function abmelden() { if (sb) await sb.auth.signOut(); location.reload(); }

async function startMitSitzung(session) {
  S.api = restApi(async () => { const { data } = await sb.auth.getSession(); return data.session ? data.session.access_token : session.access_token; });
  try {
    const profil = await S.api.meinProfil(session.user.id);
    if (!profil) return wartet({ email: session.user.email });
    S.profil = profil;
    if (profil.rolle === 'wartend') return wartet(profil);
    S.modus = profil.rolle === 'einkauf' ? 'einkauf' : 'admin';
    laden();
  } catch (e) {
    $('#root').innerHTML = `<div class="setup"><h1>Keine Verbindung</h1><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div>`;
  }
}

    </div><p class="sum" style="margin-top:10px">App-Version ${APP_VERSION}</p><div class="actions"><button class="btn" data-close>Schliessen</button></div>`);
  if (admin) {
    $('#mBenutzer', ov).onclick = () => { ov.remove(); benutzerDialog(); };
  }
  $('#mAbmelden', ov).onclick = abmelden;
}

async function benutzerDialog() {
  let liste;
  try { liste = await S.api.benutzer(); } catch (e) { return fehler(e); }
  const rollen = [['admin', 'Admin'], ['einkauf', 'Einkauf'], ['wartend', 'Gesperrt / wartet']];
  const ov = dialog(`<h2>Benutzer</h2>
    <p class="sum">Neue Personen melden sich selbst mit ihrer E-Mail an und erscheinen hier als «wartet». Gib ihnen dann eine Rolle.</p>
    <div class="card">${liste.map(b => `<div class="row" data-id="${esc(b.id)}"><div class="main"><div class="name">${esc(b.email)}</div>
      <div class="meta">${b.id === S.profil.id ? 'Das bist du' : ''}</div></div>
      ${b.id === S.profil.id ? `<span class="tag">Admin</span>` : `<select class="laden" data-rolle>${rollen.map(([k, t]) => `<option value="${k}" ${b.rolle === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="iconbtn" data-weg aria-label="Entfernen">✕</button>`}</div>`).join('')}</div>
    <div class="actions"><button class="btn" data-close>Fertig</button></div>`);
  ov.querySelectorAll('.row[data-id]').forEach(row => {
    const id = row.dataset.id, sel = $('[data-rolle]', row), weg = $('[data-weg]', row);
    if (sel) sel.onchange = async () => { try { await S.api.benutzerRolle(id, sel.value); toast('Rolle gespeichert.'); } catch (e) { fehler(e); } };
    if (weg) weg.onclick = async () => { try { await S.api.benutzerLoeschen(id); row.remove(); toast('Entfernt. Die Person kann sich neu anmelden und wartet dann wieder auf Freigabe.'); } catch (e) { fehler(e); } };
  });
}

(async function start() {
  store.del(KEY_STORE); store.del('einkauf-app-modus');   // alte Schlüssel-Links aus Version 1
  if (/[?&]demo\b/.test(location.search)) {
    S.modus = /[?&]einkauf\b/.test(location.search) ? 'einkauf' : 'admin';
    S.profil = { id: 'demo', email: 'demo@example.ch', rolle: S.modus === 'einkauf' ? 'einkauf' : 'admin' };
    S.api = demoApi(); return laden();
  }
  if (!window.supabase) {
    $('#root').innerHTML = `<div class="setup"><h1>Keine Verbindung</h1><p>Die App konnte nicht vollständig geladen werden. Bitte Internetverbindung prüfen.</p><button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div>`;
    return;
  }
  // Fehler aus dem Anmelde-Link (z. B. abgelaufen)
  const hp = new URLSearchParams((location.hash || '').slice(1));
  if (hp.get('error')) {
    history.replaceState(null, '', location.pathname);
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'implicit' } });
    return anmelden(hp.get('error_code') === 'otp_expired' ? 'Der Anmelde-Link ist abgelaufen oder wurde schon benutzt. Bitte einen neuen anfordern.' : 'Anmeldung fehlgeschlagen. Bitte nochmals versuchen.');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  if (data.session) return startMitSitzung(data.session);
  let gestartet = false;
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && session && !gestartet) { gestartet = true; startMitSitzung(session); } });
  anmelden();
})();
</script>
