<script>
'use strict';
/* =========================================================================
   Einkauf & Vorrat
   Daten liegen in Supabase (Projekt einkaufs-app). Zugriff nur mit Login
   (E-Mail-Link). Die Datenbank prüft die Rolle selbst (Row Level Security):
   admin = alles, einkauf = nur Liste abhaken / nicht erhältlich / erledigt,
   wartend = nichts. Der Schlüssel unten ist öffentlich und gibt ohne Login
   keinen Zugriff.
   ========================================================================= */
const SUPABASE_URL = 'https://xfwxgviomkamxqsfhvow.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tSxo17j-CvZGLeO67zkTuw_oV5Kz8-L';
const KEY_STORE = 'einkauf-app-schluessel';
let sb = null;
const LAEDEN = ['Denner', 'Migros', 'Lidl', 'Coop', 'Türkengeschäft'];
const OHNE_LADEN = 'Ohne Laden';
const OHNE_KAT = 'Ohne Kategorie';

/* ---------- Hilfen ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && !Number.isNaN(v);
const toNum = v => (v === '' || v === null || v === undefined) ? null : Number(String(v).replace(',', '.'));
const fmt = n => isNum(n) ? String(Math.round(n * 100) / 100).replace('.', ',') : '';
const coll = new Intl.Collator('de-CH', { sensitivity: 'base', numeric: true });
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* ---------- Datenzugriff (Supabase REST) ---------- */
function restApi(tokenHolen) {
  const base = SUPABASE_URL + '/rest/v1/';
  async function call(method, path, body, prefer) {
    const token = await tokenHolen();
    const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    if (prefer) headers.Prefer = prefer;
    const res = await fetch(base + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    if (!res.ok) {
      let msg = res.status + '';
      try { const j = await res.json(); msg = j.message || j.hint || msg; } catch (e) {}
      const err = new Error(msg); err.status = res.status; throw err;
    }
    if (res.status === 204) return null;
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }
  return {
    artikel: () => call('GET', 'artikel?select=*&aktiv=eq.true&order=name.asc'),
    artikelNeu: obj => call('POST', 'artikel', obj, 'return=representation').then(r => r[0]),
    artikelAendern: (id, obj) => call('PATCH', 'artikel?id=eq.' + id, obj, 'return=representation').then(r => r[0]),
    offenerEinkauf: () => call('GET', 'einkauf?select=*&abgeschlossen_am=is.null&order=id.desc&limit=1').then(r => r[0] || null),
    einkaufNeu: () => call('POST', 'einkauf', {}, 'return=representation').then(r => r[0]),
    einkaufAbschliessen: id => call('PATCH', 'einkauf?id=eq.' + id, { abgeschlossen_am: new Date().toISOString() }),
    einkaufErledigt: (id, ja) => call('PATCH', 'einkauf?id=eq.' + id, { erledigt_am: ja ? new Date().toISOString() : null }, 'return=representation').then(r => r[0]),
    positionen: eid => call('GET', 'einkauf_position?select=*&einkauf_id=eq.' + eid + '&order=id.asc'),
    positionNeu: obj => call('POST', 'einkauf_position', obj, 'return=representation').then(r => r[0]),
    positionAendern: (id, obj) => call('PATCH', 'einkauf_position?id=eq.' + id, obj, 'return=representation').then(r => r[0]),
    positionLoeschen: id => call('DELETE', 'einkauf_position?id=eq.' + id),
    fruehereZusatz: () => call('GET', 'einkauf_position?select=freitext,kategorie,laden&freitext=not.is.null&order=id.desc&limit=300'),
    meinProfil: uid => call('GET', 'benutzer?select=*&id=eq.' + uid).then(r => r[0] || null),
    benutzer: () => call('GET', 'benutzer?select=*&order=erstellt_am.asc'),
    benutzerRolle: (id, rolle) => call('PATCH', 'benutzer?id=eq.' + id, { rolle }, 'return=representation').then(r => r[0]),
    benutzerLoeschen: id => call('DELETE', 'benutzer?id=eq.' + id),
  };
}

/* Demo-Daten (nur mit ?demo): zum Ausprobieren ohne Datenbank */

    { id: 2, name: 'Cola Zero', laeden: ['Migros'], standardladen: 'Migros', nur_aktion: false, routine: true, routine_menge: 2, bestand: null, mindestbestand: 2, kategorie: 'Frühstück & Getränke', bemerkung: null, aktiv: true },
    { id: 3, name: 'Gehackte Tomaten', laeden: ['Denner', 'Migros'], standardladen: 'Migros', nur_aktion: true, routine: false, routine_menge: null, bestand: 1, mindestbestand: 2, kategorie: 'Konserven & Saucen', bemerkung: null, aktiv: true },
    { id: 4, name: 'Tomatenpüree', laeden: ['Denner', 'Migros'], standardladen: 'Migros', nur_aktion: false, routine: false, routine_menge: null, bestand: 0, mindestbestand: 1, kategorie: 'Konserven & Saucen', bemerkung: null, aktiv: true },
    { id: 5, name: 'Bulgur', laeden: ['Denner', 'Türkengeschäft'], standardladen: 'Türkengeschäft', nur_aktion: false, routine: false, routine_menge: null, bestand: 3, mindestbestand: 1, kategorie: 'Teigwaren, Reis & Hülsenfrüchte', bemerkung: null, aktiv: true },
    { id: 6, name: 'Kohlrabi', laeden: ['Denner', 'Migros'], standardladen: null, nur_aktion: false, routine: true, routine_menge: 3, bestand: null, mindestbestand: null, kategorie: 'Brot & Frischware', bemerkung: null, aktiv: true },
    { id: 7, name: 'Blumenkohl', laeden: ['Denner', 'Migros'], standardladen: 'Migros', nur_aktion: true, routine: false, routine_menge: null, bestand: null, mindestbestand: null, kategorie: null, bemerkung: null, aktiv: true },
  ];
  let E = []; let P = [];

    artikelAendern: (id, o) => { const a = A.find(x => x.id === id); Object.assign(a, o); return later(a); },

    einkaufAbschliessen: id => { E.find(e => e.id === id).abgeschlossen_am = new Date().toISOString(); return later(null); },

    positionNeu: o => { const p = Object.assign({ id: ++nid, artikel_id: null, freitext: null, kategorie: null, menge_anpassung: 0, menge_fix: null, laden: null, aufnehmen: null, gekauft: false, nicht_erhaeltlich: false, in_aktion: false, menge_gekauft: null }, o); P.push(p); return later(p); },
    positionAendern: (id, o) => { const p = P.find(x => x.id === id); Object.assign(p, o); return later(p); },
    positionLoeschen: id => { P = P.filter(x => x.id !== id); return later(null); },
    fruehereZusatz: () => later(P.filter(p => p.freitext).map(p => ({ freitext: p.freitext, kategorie: p.kategorie, laden: p.laden }))),
    meinProfil: () => later({ id: 'demo', email: 'demo@example.ch', rolle: 'admin' }),
    benutzer: () => later([{ id: 'demo', email: 'demo@example.ch', rolle: 'admin' }, { id: 'u2', email: 'einkauf@example.ch', rolle: 'wartend' }]),
    benutzerRolle: (id, rolle) => later({ id, rolle }),
    benutzerLoeschen: () => later(null),
  };
}

/* ---------- Zustand ---------- */
const S = {
  api: null, artikel: [], einkauf: null, pos: [], frueher: [],
  tab: 'liste', suche: '', filter: 'alle', laden: 'alle', ekLaden: 'alle',
};
const posFor = id => S.pos.find(p => p.artikel_id === id);
const artById = id => S.artikel.find(a => a.id === id);
const kategorien = () => [...new Set(S.artikel.map(a => a.kategorie).filter(Boolean).concat(S.pos.map(p => p.kategorie).filter(Boolean)))].sort(coll.compare);

/* ---------- Einkaufslogik ---------- */
// Grundmenge ohne Wochenanpassung
function grund(a) {
  if (a.routine) return { menge: a.routine_menge || 0, grund: 'Routine' };
  if (isNum(a.bestand) && isNum(a.mindestbestand) && a.bestand <= a.mindestbestand)
    return { menge: a.mindestbestand - a.bestand + 1, grund: 'Nachkaufen' };
  return { menge: 0, grund: '' };
}
// Berechnet alle Zeilen der aktuellen Liste
function berechneListe() {
  const liste = [], aktion = [], entfernt = [];
  for (const a of S.artikel) {
    const p = posFor(a.id), g = grund(a);
    const laden = (p && p.laden) || a.standardladen || OHNE_LADEN;
    let menge = p && p.menge_fix != null ? p.menge_fix : g.menge + ((p && p.menge_anpassung) || 0);
    const item = { a, p, laden, menge, grund: g.grund, faellig: g.menge > 0, kategorie: a.kategorie || OHNE_KAT, name: a.name };
    if (p && p.aufnehmen === false) { if (g.menge > 0 || a.nur_aktion) entfernt.push(item); continue; }
    const aufgenommen = p && (p.aufnehmen === true || (a.nur_aktion && p.in_aktion));
    if (a.nur_aktion && !aufgenommen) { aktion.push(item); continue; }
    if (aufgenommen) { item.grund = item.grund || (a.nur_aktion ? 'Aktion' : 'Zusätzlich'); if (item.menge < 1) item.menge = 1; liste.push(item); continue; }
    if (menge > 0) liste.push(item);
  }
  for (const p of S.pos.filter(p => !p.artikel_id)) {
    liste.push({ a: null, p, laden: p.laden || OHNE_LADEN, menge: p.menge_fix || 1, grund: 'Zusätzlich', kategorie: p.kategorie || OHNE_KAT, name: p.freitext });
  }
  return { liste, aktion, entfernt };
}

/* Position anlegen oder ändern */
async function setzePos(item, aenderung) {
  try {
    if (item.p) {
      const neu = await S.api.positionAendern(item.p.id, aenderung);
      Object.assign(item.p, neu);
    } else {
      const neu = await S.api.positionNeu(Object.assign({ einkauf_id: S.einkauf.id, artikel_id: item.a.id }, aenderung));
      S.pos.push(neu);
    }
  } catch (e) { fehler(e); }
  render();
}
async function setzeArtikel(a, aenderung) {
  try { Object.assign(a, await S.api.artikelAendern(a.id, aenderung)); } catch (e) { fehler(e); }
  render();
}

        <button class="iconbtn" id="neuLaden" title="Neu laden" aria-label="Neu laden">↻</button>
        <button class="iconbtn" id="menue" title="Menü" aria-label="Menü">☰</button></div>
      ${tabs.length ? `<div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${t}</button>`).join('')}</div>` : ''}
    </header>
    <main id="main"></main>`;
  root.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; window.scrollTo(0, 0); render(); });
  $('#neuLaden').onclick = () => laden();
  $('#menue').onclick = menue;
  const main = $('#main');
  if (S.tab === 'einkaufen') renderEinkaufen(main);
  else if (S.tab === 'liste') renderListe(main);
  else renderArtikel(main);
  window.scrollTo(0, y);
}

function ladenPill(l) { return l === OHNE_LADEN ? `<span class="pill">${OHNE_LADEN}</span>` : `<span class="pill ${esc(l)}">${esc(l)}</span>`; }
function ladenSelect(cur, cls = 'laden') {
  return `<select class="${cls}" aria-label="Laden">${(cur === OHNE_LADEN ? [OHNE_LADEN] : []).concat(LAEDEN).map(l => `<option ${l === cur ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
}
function gruppiere(items, key) {
  const m = new Map();
  for (const it of items) { const k = key(it); if (!m.has(k)) m.set(k, []); m.get(k).push(it); }
  return m;
}

/* ===== Einkaufsliste ===== */
function renderListe(main) {
  const { liste, aktion, entfernt } = berechneListe();
  const ladenListe = LAEDEN.concat([OHNE_LADEN]).filter(l => liste.some(i => i.laden === l));
  if (S.laden !== 'alle' && !ladenListe.includes(S.laden)) S.laden = 'alle';
  const sichtbar = liste.filter(i => S.laden === 'alle' || i.laden === S.laden);
  const offen = liste.filter(i => !(i.p && i.p.gekauft)).length;

  let html = hinweise(liste) + `<div class="chips" role="group" aria-label="Laden filtern">
      <button class="chip" data-laden="alle" aria-pressed="${S.laden === 'alle'}">Alle (${liste.length})</button>
      ${ladenListe.map(l => `<button class="chip" data-laden="${esc(l)}" aria-pressed="${S.laden === l}">${esc(l)} (${liste.filter(i => i.laden === l).length})</button>`).join('')}
    </div>`;

  if (!liste.length) html += `<div class="card"><div class="empty">Noch nichts auf der Liste. Routineartikel und Artikel unter dem Mindestbestand erscheinen hier automatisch.</div></div>`;

  const nachLaden = gruppiere(sichtbar, i => i.laden);
  for (const l of ladenListe) {
    const items = nachLaden.get(l); if (!items) continue;
    html += `<h2>${ladenPill(l)} <span class="sum">${items.filter(i => !(i.p && i.p.gekauft)).length} offen</span>
      <button class="btn small" data-kopieren="${esc(l)}" style="margin-left:auto">Liste kopieren</button></h2><div class="card">`;
    const nachKat = gruppiere(items.sort((x, y) => coll.compare(x.kategorie, y.kategorie) || coll.compare(x.name, y.name)), i => i.kategorie);
    let first = true;
    for (const [kat, its] of nachKat) {
      html += `<div class="row" style="padding:6px 12px;${first ? '' : ''}"><h3 style="margin:0">${esc(kat)}</h3></div>`;
      first = false;
      for (const i of its) html += listenZeile(i);
    }
    html += `</div>`;
  }

  // Nur-Aktion-Artikel
  if (aktion.length) {
    const sorted = aktion.sort((x, y) => (y.faellig - x.faellig) || coll.compare(x.name, y.name));
    const faellig = aktion.filter(i => i.faellig).length;
    html += `<h2>Nur bei Aktion</h2>
      <details class="card" ${faellig ? 'open' : ''}><summary>${aktion.length} Artikel – diese Woche in Aktion? ${faellig ? `<span class="tag warn">${faellig} fällig</span>` : ''}</summary>
      <div class="rows">${sorted.map(i => `
        <div class="row"><div class="main"><div class="name">${esc(i.name)}</div>
          <div class="meta">${ladenPill(i.laden)} ${vorratText(i.a)} ${i.faellig ? `<span class="tag warn">${esc(i.grund)}</span>` : ''}</div></div>
          <button class="btn small" data-aufnehmen="${i.a.id}">In Aktion → aufnehmen</button></div>`).join('')}</div></details>`;
  }
  if (entfernt.length) {
    html += `<h2>Diese Woche entfernt</h2><details class="card"><summary>${entfernt.length} Artikel</summary><div class="rows">
      ${entfernt.map(i => `<div class="row"><div class="main"><div class="name">${esc(i.name)}</div><div class="meta">${ladenPill(i.laden)}</div></div>
      <button class="btn small" data-zurueck="${i.a.id}">Zurückholen</button></div>`).join('')}</div></details>`;
  }

  html += `<div class="footer-actions">
      <button class="btn" id="exportListe">Liste als Text kopieren</button>
      <button class="btn primary" id="abschliessen" ${liste.length ? '' : 'disabled'}>Einkauf abschliessen</button>
    </div>
    <p class="sum" style="margin-top:8px">${offen} von ${liste.length} noch offen. «Einkauf abschliessen» bucht gekaufte Vorratsartikel in den Bestand und startet die nächste Liste.</p>
    <button class="btn primary fab" id="hinzu">+ Hinzufügen</button>`;
  main.innerHTML = html;

  main.querySelectorAll('[data-laden]').forEach(b => b.onclick = () => { S.laden = b.dataset.laden; render(); });
  main.querySelectorAll('[data-aufnehmen]').forEach(b => b.onclick = () => {
    const a = artById(+b.dataset.aufnehmen), g = grund(a), p = posFor(a.id);
    setzePos({ a, p }, { aufnehmen: true, in_aktion: true, menge_fix: (p && p.menge_fix) || Math.max(1, g.menge) });
  });
  const ab = $('#hAbschliessen'); if (ab) ab.onclick = abschliessenDialog;
  main.querySelectorAll('[data-zurueck]').forEach(b => b.onclick = () => {
    const a = artById(+b.dataset.zurueck); setzePos({ a, p: posFor(a.id) }, { aufnehmen: a.nur_aktion ? true : null });
  });
  main.querySelectorAll('[data-kopieren]').forEach(b => b.onclick = () => kopiereText(textListe(liste.filter(i => i.laden === b.dataset.kopieren))));
  $('#exportListe').onclick = () => kopiereText(textListe(liste));
  $('#abschliessen').onclick = abschliessenDialog;
  $('#hinzu').onclick = hinzufuegenDialog;
  verdrahteZeilen(main, liste);
}

function vorratText(a) {
  if (!a) return '';
  const b = isNum(a.bestand) ? fmt(a.bestand) : '?';
  const unter = isNum(a.bestand) && isNum(a.mindestbestand) && a.bestand <= a.mindestbestand;
  return `<span class="${unter ? 'tag warn' : 'tag grau'}">Vorrat ${b}${isNum(a.mindestbestand) ? ' / Min ' + fmt(a.mindestbestand) : ''}</span>`;
}

/* Hinweise oben auf der Liste (nur Admin-Ansicht) */
function hinweise(liste) {
  const unter = S.artikel.filter(a => isNum(a.bestand) && isNum(a.mindestbestand) && a.bestand <= a.mindestbestand)
    .sort((x, y) => coll.compare(x.name, y.name));
  const na = liste.filter(i => i.p && i.p.nicht_erhaeltlich);
  let h = '';
  if (S.einkauf && S.einkauf.erledigt_am) {
    const d = new Date(S.einkauf.erledigt_am);
    h += `<div class="hinweis ok"><b>Einkauf erledigt</b> gemeldet am ${d.toLocaleDateString('de-CH')} um ${d.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' })}.
      <button class="btn small primary" id="hAbschliessen">Jetzt abschliessen</button></div>`;
  }
  if (na.length) h += `<div class="hinweis warn"><b>Nicht erhältlich gemeldet:</b> ${na.map(i => esc(i.name) + ' (' + esc(i.laden) + ')').join(', ')}. Bleibt auf der Liste, bis du es entfernst.</div>`;
  if (unter.length) h += `<div class="hinweis warn"><b>Unter Mindestbestand (${unter.length}):</b> ${unter.map(a => `${esc(a.name)} <span class="sum">${fmt(a.bestand)}/${fmt(a.mindestbestand)}</span>`).join(', ')}</div>`;
  return h;
}

/* ===== Ansicht für die einkaufende Person ===== */
const gekauftAnders = i => i.p && i.p.menge_gekauft != null && i.p.menge_gekauft !== i.menge;
const gekaufteMenge = i => (i.p && i.p.menge_gekauft != null) ? i.p.menge_gekauft : i.menge;

function renderEinkaufen(main) {
  const { liste } = berechneListe();
  const reiter = [['alle', 'Gesamt'], ['Migros', 'Migros'], ['Denner', 'Denner']];
  if (!reiter.some(r => r[0] === S.ekLaden)) S.ekLaden = 'alle';
  const sichtbar = liste.filter(i => S.ekLaden === 'alle' || i.laden === S.ekLaden);
  const offen = sichtbar.filter(i => !(i.p && i.p.gekauft)).length;
  let html = `<div class="chips" role="group" aria-label="Liste wählen">${reiter.map(([k, t]) => `<button class="chip" data-r="${k}" aria-pressed="${S.ekLaden === k}">${t} (${liste.filter(i => k === 'alle' || i.laden === k).length})</button>`).join('')}</div>`;
  if (S.einkauf && S.einkauf.erledigt_am) html += `<div class="hinweis ok"><b>Als erledigt gemeldet.</b></div>`;
  if (!sichtbar.length) html += `<div class="card"><div class="empty">Keine Artikel auf dieser Liste.</div></div>`;
  const g = gruppiere(sichtbar, i => i.laden);
  for (const l of LAEDEN.concat([OHNE_LADEN])) {
    const its = g.get(l); if (!its) continue;
    html += `<h2>${ladenPill(l)} <span class="sum">${its.filter(i => !(i.p && i.p.gekauft)).length} offen</span></h2><div class="card">`;
    for (const i of its.sort((x, y) => coll.compare(x.kategorie, y.kategorie) || coll.compare(x.name, y.name))) {
      const p = i.p || {}, key = i.a ? 'a' + i.a.id : 'p' + p.id;
      html += `<div class="row${p.gekauft ? ' done' : ''}${p.nicht_erhaeltlich ? ' na' : ''}" data-key="${key}">
        <input type="checkbox" class="check" data-act="gekauft" ${p.gekauft ? 'checked' : ''} aria-label="Gekauft">
        <div class="main"><div class="name">${esc(i.name)}</div>
          <div class="meta">${esc(i.kategorie)}${p.in_aktion ? ' · <span class="tag">Aktion</span>' : ''}${gekauftAnders(i) ? ` · <span class="tag warn">${fmt(p.menge_gekauft)} von ${fmt(i.menge)}</span>` : ''}</div>
          <button class="btn small ${p.nicht_erhaeltlich ? 'danger' : ''}" data-act="na" style="margin-top:6px">${p.nicht_erhaeltlich ? 'Nicht erhältlich ✓' : 'Nicht erhältlich'}</button></div>
        <div class="stepper" title="Gekaufte Menge"><button class="iconbtn" data-act="minus" aria-label="Weniger">−</button><span class="menge">${fmt(p.menge_gekauft ?? i.menge)}</span><button class="iconbtn" data-act="plus" aria-label="Mehr">+</button></div>
      </div>`;
    }
    html += `</div>`;
  }
  const erledigt = S.einkauf && S.einkauf.erledigt_am;
  html += `<p class="sum" style="margin-top:14px">${offen} noch offen.</p>
    <div class="footer-actions"><button class="btn ${erledigt ? '' : 'primary'}" id="erledigt">${erledigt ? 'Erledigt-Meldung zurücknehmen' : 'Einkauf erledigt'}</button></div>`;
  main.innerHTML = html;
  main.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.ekLaden = b.dataset.r; render(); });
  const map = new Map(liste.map(i => [i.a ? 'a' + i.a.id : 'p' + i.p.id, i]));
  main.querySelectorAll('.row[data-key]').forEach(row => {
    const i = map.get(row.dataset.key); if (!i) return;
    $('[data-act=gekauft]', row).onchange = e => setzePos(i, e.target.checked ? { gekauft: true } : { gekauft: false, menge_gekauft: null });
    const ist = () => (i.p && i.p.menge_gekauft != null) ? i.p.menge_gekauft : i.menge;
    $('[data-act=plus]', row).onclick = () => setzePos(i, { menge_gekauft: ist() + 1, gekauft: true });
    $('[data-act=minus]', row).onclick = () => { const n = Math.max(0, ist() - 1); setzePos(i, { menge_gekauft: n, gekauft: n > 0 }); };
    $('[data-act=na]', row).onclick = () => setzePos(i, { nicht_erhaeltlich: !(i.p && i.p.nicht_erhaeltlich) });
  });
  $('#erledigt').onclick = async () => {
    try { S.einkauf = await S.api.einkaufErledigt(S.einkauf.id, !erledigt); } catch (e) { fehler(e); }
    render(); if (!erledigt) toast('Einkauf als erledigt gemeldet.');
  };
}

function listenZeile(i) {
  const p = i.p || {}, key = i.a ? 'a' + i.a.id : 'p' + p.id;
  const cls = (p.gekauft ? ' done' : '') + (p.nicht_erhaeltlich ? ' na' : '');
  const anders = i.a && p.laden && p.laden !== i.a.standardladen;
  return `<div class="row${cls}" data-key="${key}">
    <input type="checkbox" class="check" data-act="gekauft" ${p.gekauft ? 'checked' : ''} aria-label="Gekauft">
    <div class="main">
      <div class="name">${esc(i.name)}</div>
      <div class="meta">${esc(i.grund)}${i.a ? ' · ' + vorratText(i.a) : ''}${p.gekauft && gekauftAnders(i) ? ` · <span class="tag warn">gekauft ${fmt(p.menge_gekauft)} von ${fmt(i.menge)}</span>` : ''}${anders ? ' · <span class="tag">nur diese Woche</span>' : ''}${p.nicht_erhaeltlich ? ' · <span class="tag warn">nicht erhältlich</span>' : ''}</div>
      <div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${ladenSelect(i.laden)}
        <button class="chip aktion" data-act="aktion" aria-pressed="${!!p.in_aktion}">${p.in_aktion ? 'In Aktion' : 'Aktion?'}</button></div>
    </div>
    <div class="stepper">
      <button class="iconbtn" data-act="minus" aria-label="Weniger">−</button><span>${fmt(i.menge)}</span>
      <button class="iconbtn" data-act="plus" aria-label="Mehr">+</button>
    </div>
    <button class="iconbtn" data-act="mehr" aria-label="Weitere Aktionen">⋯</button>
  </div>`;
}

function verdrahteZeilen(main, liste) {
  const map = new Map(liste.map(i => [i.a ? 'a' + i.a.id : 'p' + i.p.id, i]));
  main.querySelectorAll('.row[data-key]').forEach(row => {
    const i = map.get(row.dataset.key); if (!i) return;
    row.querySelector('[data-act=gekauft]').onchange = e => setzePos(i, { gekauft: e.target.checked });
    row.querySelector('[data-act=plus]').onclick = () => setzePos(i, { menge_fix: i.menge + 1 });
    row.querySelector('[data-act=minus]').onclick = () => {
      if (i.menge > 1) return setzePos(i, { menge_fix: i.menge - 1 });
      entfernen(i);
    };
    row.querySelector('select.laden').onchange = e => ladenGeaendert(i, e.target.value);
    row.querySelector('[data-act=aktion]').onclick = () => setzePos(i, { in_aktion: !(i.p && i.p.in_aktion) });
    row.querySelector('[data-act=mehr]').onclick = () => zeilenMenue(i);
  });
}

async function entfernen(i) {
  if (!i.a) { try { await S.api.positionLoeschen(i.p.id); S.pos = S.pos.filter(p => p !== i.p); } catch (e) { fehler(e); } render(); return; }
  const vorher = { aufnehmen: i.p ? i.p.aufnehmen : null, menge_fix: i.p ? i.p.menge_fix : null };
  await setzePos(i, { aufnehmen: false, menge_fix: null, gekauft: false });
  toast(`«${i.name}» für diese Woche entfernt.`, 'Rückgängig', () => setzePos({ a: i.a, p: posFor(i.a.id) }, vorher));
}

async function ladenGeaendert(i, laden) {
  if (!i.a) return setzePos(i, { laden });
  await setzePos(i, { laden: laden === i.a.standardladen ? null : laden });
  if (laden !== i.a.standardladen) {
    toast(`Diese Woche bei ${laden}.`, 'Immer dort kaufen', async () => {
      const laeden = [...new Set((i.a.laeden || []).concat([laden]))];
      await setzeArtikel(i.a, { standardladen: laden, laeden });
      const p = posFor(i.a.id); if (p) await setzePos({ a: i.a, p }, { laden: null });
      toast(`Standardladen von «${i.a.name}» ist jetzt ${laden}.`);
    });
  }
}

function zeilenMenue(i) {
  const p = i.p || {};
  const ov = dialog(`<h2>${esc(i.name)}</h2>
    <div class="field"><div class="lbl">Menge diese Woche</div>
      <input type="number" min="1" step="1" id="mMenge" value="${fmt(i.menge)}" inputmode="numeric"></div>
    <div class="opts" style="margin:12px 0">
      <button class="btn" id="mNA">${p.nicht_erhaeltlich ? 'Wieder erhältlich' : 'Nicht erhältlich'}</button>
      <button class="btn danger" id="mWeg">Diese Woche entfernen</button>
      ${i.a ? `<button class="btn" id="mBearb">Artikel bearbeiten</button>` : ''}
      ${!i.a ? `<button class="btn" id="mAlsArtikel">Als Vorratsartikel speichern</button>` : ''}
    </div>
    <div class="actions"><button class="btn" data-close>Schliessen</button><button class="btn primary" id="mOk">Menge speichern</button></div>`);
  $('#mOk', ov).onclick = () => { const v = Math.round(toNum($('#mMenge', ov).value)); if (v >= 1) setzePos(i, { menge_fix: v }); ov.remove(); };
  $('#mNA', ov).onclick = () => { setzePos(i, { nicht_erhaeltlich: !p.nicht_erhaeltlich }); ov.remove(); };
  $('#mWeg', ov).onclick = () => { ov.remove(); entfernen(i); };
  if (i.a) $('#mBearb', ov).onclick = () => { ov.remove(); artikelDialog(i.a); };
  if (!i.a) $('#mAlsArtikel', ov).onclick = () => { ov.remove(); artikelDialog(null, { name: i.name, kategorie: i.p.kategorie, standardladen: i.p.laden }, i.p); };
}

function textListe(items) {
  const g = gruppiere(items.filter(i => !(i.p && i.p.gekauft)), i => i.laden);
  let t = [];
  for (const l of LAEDEN.concat([OHNE_LADEN])) {
    const its = g.get(l); if (!its) continue;
    t.push(l.toUpperCase());
    its.sort((x, y) => coll.compare(x.kategorie, y.kategorie) || coll.compare(x.name, y.name))
      .forEach(i => t.push(`- ${fmt(i.menge)}× ${i.name}`));
    t.push('');
  }
  return t.join('\n').trim() || 'Liste ist leer.';
}
async function kopiereText(t) {
  try { await navigator.clipboard.writeText(t); toast('Liste kopiert.'); }
  catch (e) {
    const ov = dialog(`<h2>Liste</h2><div class="field"><textarea rows="12" readonly>${esc(t)}</textarea></div><div class="actions"><button class="btn" data-close>Schliessen</button></div>`);
    $('textarea', ov).select();
  }
}

/* Hinzufügen: Vorratsartikel, frühere Zusatzartikel oder neuer Freitext */
function hinzufuegenDialog() {
  const ov = dialog(`<h2>Zur Liste hinzufügen</h2>
    <input class="search" id="hSuche" placeholder="Artikel suchen oder neu eingeben …" autocomplete="off">
    <div id="hErg" class="card" style="margin-top:10px"></div>
    <div class="actions"><button class="btn" data-close>Fertig</button></div>`);
  const inp = $('#hSuche', ov), erg = $('#hErg', ov);
  const frueher = [...new Map(S.frueher.map(f => [f.freitext.toLowerCase(), f])).values()];
  function zeige() {
    const q = inp.value.trim().toLowerCase();
    const aufListe = new Set(berechneListe().liste.filter(i => i.a).map(i => i.a.id));
    const treffer = S.artikel.filter(a => !q || a.name.toLowerCase().includes(q)).sort((x, y) => coll.compare(x.name, y.name)).slice(0, q ? 30 : 0);
    const zus = frueher.filter(f => (!q || f.freitext.toLowerCase().includes(q)) && !S.pos.some(p => !p.artikel_id && p.freitext.toLowerCase() === f.freitext.toLowerCase()));
    let h = '';
    for (const a of treffer) h += `<div class="result"><div class="main"><div class="name">${esc(a.name)}</div><div class="meta">${a.standardladen ? ladenPill(a.standardladen) : ''} ${esc(a.kategorie || '')}</div></div>
      ${aufListe.has(a.id) ? '<span class="tag">auf Liste</span>' : `<button class="btn small" data-art="${a.id}">+</button>`}</div>`;
    if (!q && zus.length) {
      h += `<div class="result"><h3 style="margin:0">Früher hinzugefügt</h3></div>`;
      const g = gruppiere(zus.sort((x, y) => coll.compare(x.kategorie || OHNE_KAT, y.kategorie || OHNE_KAT)), f => f.kategorie || OHNE_KAT);
      for (const [k, fs] of g) h += `<div class="result"><div class="main"><div class="meta">${esc(k)}</div><div class="opts" style="margin-top:4px">${fs.map(f => `<button class="chip" data-frueher="${esc(f.freitext)}">+ ${esc(f.freitext)}</button>`).join('')}</div></div></div>`;
    } else if (q) {
      for (const f of zus.slice(0, 10)) h += `<div class="result"><div class="main"><div class="name">${esc(f.freitext)}</div><div class="meta">früher hinzugefügt · ${esc(f.kategorie || '')}</div></div><button class="btn small" data-frueher="${esc(f.freitext)}">+</button></div>`;
    }
    if (q && !S.artikel.some(a => a.name.toLowerCase() === q)) {
      h += `<div class="result"><div class="main"><div class="name">«${esc(inp.value.trim())}»</div><div class="meta">neu</div></div>
        <button class="btn small" data-einmal>Nur diese Woche</button><button class="btn small primary" data-neuart>Als Vorratsartikel</button></div>`;
    }
    erg.innerHTML = h || '<div class="empty">Tippe einen Namen ein. Früher hinzugefügte Zusatzartikel erscheinen hier.</div>';
    erg.querySelectorAll('[data-art]').forEach(b => b.onclick = async () => {
      const a = artById(+b.dataset.art), p = posFor(a.id);

    });
    erg.querySelectorAll('[data-frueher]').forEach(b => b.onclick = () => {
      const f = frueher.find(x => x.freitext === b.dataset.frueher);

    const e2 = $('[data-neuart]', erg); if (e2) e2.onclick = () => { ov.remove(); artikelDialog(null, { name: inp.value.trim() }, null, true); };
  }
  inp.oninput = zeige; zeige(); setTimeout(() => inp.focus(), 50);
}

/* ===== Vorrat & Artikel ===== */
const FILTER = [
  ['alle', 'Alle'], ['routine', 'Routine'], ['aktion', 'Nur Aktion'], ['ohneBestand', 'Bestand fehlt'],
  ['unterMin', 'Unter Minimum'], ['ohneKat', 'Ohne Kategorie'], ['ohneLaden', 'Ohne Standardladen'],
];
function filterFn(f) {
  return {
    alle: () => true, routine: a => a.routine, aktion: a => a.nur_aktion,
    ohneBestand: a => !isNum(a.bestand), unterMin: a => grund(a).grund === 'Nachkaufen',
    ohneKat: a => !a.kategorie, ohneLaden: a => !a.standardladen,
  }[f];
}
function zaehler(a, feld, label) {
  return `<div class="zaehler" data-feld="${feld}"><span class="zlbl">${label}</span>
    <button class="iconbtn" data-d="-1" aria-label="${label} weniger">−</button>
    <input class="num" type="number" min="0" step="any" inputmode="decimal" value="${fmt(a[feld]).replace(',', '.')}" aria-label="${label}">
    <button class="iconbtn" data-d="1" aria-label="${label} mehr">+</button></div>`;
}
const speicherTimer = {};
function zaehlerSpeichern(a, feld, wert, row) {
  a[feld] = wert;
  const k = a.id + feld;
  clearTimeout(speicherTimer[k]);
  speicherTimer[k] = setTimeout(async () => {
    try { const n = await S.api.artikelAendern(a.id, { [feld]: wert }); if (n) Object.assign(a, n); }
    catch (e) { fehler(e); }
    if (row && row.isConnected) aktualisiereZeile(row, a);
  }, 500);
  if (row) aktualisiereZeile(row, a);
}
function aktualisiereZeile(row, a) {
  row.querySelectorAll('.zaehler').forEach(z => { const inp = $('input', z); if (document.activeElement !== inp) inp.value = fmt(a[z.dataset.feld]).replace(',', '.'); });
  const t = $('[data-unter]', row); if (t) t.hidden = grund(a).grund !== 'Nachkaufen' || a.routine;
}

function renderArtikel(main) {
  const admin = S.modus !== 'einkauf';
  const q = S.suche.trim().toLowerCase();
  const filter = admin ? FILTER : FILTER.filter(f => ['alle', 'unterMin', 'ohneBestand'].includes(f[0]));
  if (!filter.some(f => f[0] === S.filter)) S.filter = 'alle';
  const arts = S.artikel.filter(a => (!q || a.name.toLowerCase().includes(q)) && filterFn(S.filter)(a));
  let html = `<input class="search" id="aSuche" placeholder="Artikel suchen …" value="${esc(S.suche)}" autocomplete="off">
    <div class="chips">${filter.map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${S.filter === k}">${t} (${S.artikel.filter(filterFn(k)).length})</button>`).join('')}</div>
    <p class="sum">${admin ? 'Bestand und Minimum mit − / + anpassen oder eintippen, das wird sofort gespeichert. Für alles andere auf den Namen tippen.' : 'Bestand mit − / + anpassen, wenn etwas aufgebraucht oder dazugekommen ist. Das wird sofort gespeichert.'}</p>`;
  if (!arts.length) html += `<div class="card"><div class="empty">Keine Artikel gefunden.</div></div>`;
  const g = gruppiere(arts.sort((x, y) => coll.compare(x.kategorie || 'zzz', y.kategorie || 'zzz') || coll.compare(x.name, y.name)), a => a.kategorie || OHNE_KAT);
  for (const [kat, as] of g) {
    html += `<h2>${esc(kat)} <span class="sum">${as.length}</span></h2><div class="card">`;
    for (const a of as) {
      const unter = grund(a).grund === 'Nachkaufen';
      html += `<div class="row vorrat" data-id="${a.id}">
        <div class="main">${admin ? '<button class="linkish" data-edit>' : '<div>'}<div class="name">${esc(a.name)}</div>
          <div class="meta">${a.standardladen ? ladenPill(a.standardladen) : '<span class="tag warn">kein Standardladen</span>'}
          ${a.routine ? ` <span class="tag">Routine ${fmt(a.routine_menge)}/Wo</span>` : ''}${a.nur_aktion ? ' <span class="tag">nur Aktion</span>' : ''}
          <span class="tag warn" data-unter ${unter ? '' : 'hidden'}>unter Minimum</span>${!admin ? ` <span class="tag grau">Min ${fmt(a.mindestbestand)}</span>` : ''}</div>${admin ? '</button>' : '</div>'}</div>
        <div class="zaehlerzeile">${zaehler(a, 'bestand', 'Bestand')}${admin ? zaehler(a, 'mindestbestand', 'Min') : ''}</div>
      </div>`;
    }
    html += `</div>`;
  }
  if (admin) html += `<div class="footer-actions"><button class="btn" id="export">Tabelle exportieren (Excel/CSV)</button></div>
    <button class="btn primary fab" id="neu">+ Neuer Artikel</button>`;
  main.innerHTML = html;

  const s = $('#aSuche');
  s.oninput = () => { S.suche = s.value; const pos = s.selectionStart; render(); const n = $('#aSuche'); n.focus(); n.setSelectionRange(pos, pos); };
  main.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  main.querySelectorAll('.row[data-id]').forEach(row => {
    const a = artById(+row.dataset.id);
    const ed = $('[data-edit]', row); if (ed) ed.onclick = () => artikelDialog(a);
    row.querySelectorAll('.zaehler').forEach(z => {
      const feld = z.dataset.feld, inp = $('input', z);
      z.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
        const alt = isNum(a[feld]) ? a[feld] : 0;
        zaehlerSpeichern(a, feld, Math.max(0, alt + Number(b.dataset.d)), row);
      });
      inp.onchange = () => {
        const v = toNum(inp.value);
        if (v !== null && (Number.isNaN(v) || v < 0)) { toast('Bitte eine Zahl ab 0 eingeben.'); inp.value = fmt(a[feld]).replace(',', '.'); return; }
        zaehlerSpeichern(a, feld, v, row);
      };
    });
  });
  if (admin) { $('#neu').onclick = () => artikelDialog(null); $('#export').onclick = exportCsv; }
}

/* Artikel anlegen / bearbeiten – alle Felder, damit die Tabelle vollständig bleibt */
function artikelDialog(a, vorlage = {}, ausPosition = null, aufListe = false) {

  const ov = dialog(`<h2>${neu ? 'Neuer Artikel' : 'Artikel bearbeiten'}</h2>

    <div class="field"><label for="fKat">Kategorie *</label><input type="text" id="fKat" list="katListe2" value="${esc(v.kategorie || '')}" placeholder="Auswählen oder neue eintippen">
      <datalist id="katListe2">${kategorien().map(k => `<option value="${esc(k)}">`).join('')}</datalist></div>
    <div class="field"><div class="lbl">Erhältlich bei</div><div class="opts">${LAEDEN.map(l => `<label class="opt"><input type="checkbox" name="laeden" value="${esc(l)}" ${(v.laeden || []).includes(l) ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div></div>
    <div class="field"><label for="fStd">Standardladen *</label><select id="fStd"><option value="">– wählen –</option>${LAEDEN.map(l => `<option ${l === v.standardladen ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <div class="hint">Dort landet der Artikel automatisch auf der Liste.</div></div>
    <div class="field"><div class="lbl">Nur in Aktion kaufen?</div><div class="opts">
      <label class="opt"><input type="radio" name="aktion" value="nein" ${!v.nur_aktion ? 'checked' : ''}>Nein</label>
      <label class="opt"><input type="radio" name="aktion" value="ja" ${v.nur_aktion ? 'checked' : ''}>Ja</label></div></div>
    <div class="field"><div class="lbl">Routine-Einkauf? *</div><div class="opts">
      <label class="opt"><input type="radio" name="routine" value="nein" ${v.routine === false ? 'checked' : ''}>Nein</label>
      <label class="opt"><input type="radio" name="routine" value="ja" ${v.routine === true ? 'checked' : ''}>Ja, jede Woche</label></div></div>
    <div class="field" id="fRmWrap"><label for="fRm">Routine-Menge pro Woche *</label><input type="number" id="fRm" min="1" step="1" inputmode="numeric" value="${fmt(v.routine_menge)}"></div>
    <div class="two">
      <div class="field"><label for="fBest">Bestand aktuell</label><input type="number" id="fBest" min="0" step="any" inputmode="decimal" value="${fmt(v.bestand).replace(',', '.')}"></div>
      <div class="field"><label for="fMin">Mindestbestand</label><input type="number" id="fMin" min="0" step="any" inputmode="decimal" value="${fmt(v.mindestbestand).replace(',', '.')}"></div>
    </div>
    <div class="field"><label for="fBem">Bemerkung</label><input type="text" id="fBem" value="${esc(v.bemerkung || '')}"></div>
    ${neu && !ausPosition ? `<label class="opt" style="margin-top:4px"><input type="checkbox" id="fAufListe" ${aufListe ? 'checked' : ''}>Auch gleich auf die Einkaufsliste dieser Woche</label>` : ''}
    <div class="err" id="fErr"></div>
    <div class="actions">
      ${!neu ? `<button type="button" class="btn danger" id="fDel">Löschen</button><span class="spacer"></span>` : ''}
      <button type="button" class="btn" data-close>Abbrechen</button><button type="submit" class="btn primary" id="fOk">${neu ? 'Artikel anlegen' : 'Speichern'}</button>
    </div></form>`);
  const rmWrap = $('#fRmWrap', ov);
  const sync = () => { rmWrap.style.display = ov.querySelector('input[name=routine]:checked')?.value === 'ja' ? '' : 'none'; };
  ov.querySelectorAll('input[name=routine]').forEach(r => r.onchange = sync); sync();

  $('#fStd', ov).onchange = e => { const cb = ov.querySelector(`input[name=laeden][value="${e.target.value}"]`); if (cb) cb.checked = true; };

  $('#aForm', ov).onsubmit = async ev => {
    ev.preventDefault();
    const err = m => { $('#fErr', ov).textContent = m; };

    const obj = {

      nur_aktion: ov.querySelector('input[name=aktion]:checked').value === 'ja',
      routine: routineV === 'ja', routine_menge: routineV === 'ja' ? rm : null,

    };

        const n = await S.api.artikelNeu(obj); S.artikel.push(n);
        if (ausPosition) { await S.api.positionLoeschen(ausPosition.id); S.pos = S.pos.filter(p => p !== ausPosition); }
        if (ausPosition || $('#fAufListe', ov)?.checked) {
          const p = await S.api.positionNeu({ einkauf_id: S.einkauf.id, artikel_id: n.id, aufnehmen: true, menge_fix: ausPosition ? ausPosition.menge_fix || 1 : Math.max(1, grund(n).menge) });
          S.pos.push(p);
        }
        toast(`«${n.name}» angelegt.`);

  };

    const c = dialog(`<h2>«${esc(a.name)}» löschen?</h2><p>Der Artikel verschwindet aus Vorrat und Listen.</p>
      <div class="actions"><button class="btn" data-close>Abbrechen</button><button class="btn danger" id="dOk">Löschen</button></div>`);
    $('#dOk', c).onclick = async () => {
      try { await S.api.artikelAendern(a.id, { aktiv: false }); S.artikel = S.artikel.filter(x => x !== a); c.remove(); ov.remove(); toast('Gelöscht.'); render(); }
      catch (e) { fehler(e); }
    };
  };
  setTimeout(() => (neu ? $('#fName', ov) : null)?.focus(), 50);
}

function exportCsv() {
  const kopf = ['Produkt', ...LAEDEN, 'Standardladen', 'Nur in Aktion', 'Routine', 'Routine-Menge / Woche', 'Bestand aktuell', 'Mindestbestand', 'Kategorie', 'Bemerkung'];
  const zelle = v => { const s = v === null || v === undefined ? '' : String(v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const zeilen = S.artikel.slice().sort((x, y) => coll.compare(x.kategorie || 'zzz', y.kategorie || 'zzz') || coll.compare(x.name, y.name)).map(a => [
    a.name, ...LAEDEN.map(l => (a.laeden || []).includes(l) ? 'x' : ''), a.standardladen, a.nur_aktion ? 'ja' : 'nein', a.routine ? 'ja' : 'nein',
    a.routine_menge, fmt(a.bestand), fmt(a.mindestbestand), a.kategorie, a.bemerkung]);
  const csv = '﻿' + [kopf, ...zeilen].map(r => r.map(zelle).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url; link.download = 'vorrat-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Tabelle exportiert.');
}

/* ---------- Dialog / Toast ---------- */
function dialog(inner) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
let toastTimer;
function toast(text, aktion, fn) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(text)}</span>${aktion ? `<button>${esc(aktion)}</button>` : ''}`;
  if (aktion) $('button', t).onclick = () => { t.remove(); fn(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), aktion ? 7000 : 2500);
}
function fehler(e) {
  console.error(e);
  toast(e && e.status === 401 ? 'Zugang ungültig. Bitte den App-Link neu öffnen.' : 'Fehler beim Speichern: ' + (e && e.message || e));
}

/* ---------- Start ---------- */
async function laden() {
  try {
    const [artikel, einkaufAlt, frueher] = await Promise.all([S.api.artikel(), S.api.offenerEinkauf(), S.api.fruehereZusatz()]);
    S.artikel = artikel; S.frueher = frueher || [];
    S.einkauf = einkaufAlt || await S.api.einkaufNeu();
    S.pos = await S.api.positionen(S.einkauf.id);
    render();
  } catch (e) {
    if (e.status === 401) return anmelden('Deine Anmeldung ist abgelaufen. Bitte neu anmelden.');
    $('#root').innerHTML = `<div class="setup"><h1>Keine Verbindung</h1><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div>`;
  }
}

/* ---------- Anmeldung ---------- */
function anmelden(meldung) {
  $('#root').innerHTML = `<div class="setup"><img src="icon-192.png" alt="" onerror="this.remove()"><h1>Einkauf & Vorrat</h1>
    <p>${esc(meldung || 'Melde dich mit deiner E-Mail-Adresse an. Du bekommst einen Link per Mail, ein Passwort brauchst du nicht.')}</p>
    <form id="lForm" novalidate><input id="lMail" type="email" autocomplete="email" placeholder="deine@email.ch">
    <div class="err" id="lErr"></div><button class="btn primary" id="lOk">Anmelde-Link senden</button></form></div>`;
  $('#lForm').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('#lMail').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return $('#lErr').textContent = 'Bitte eine gültige E-Mail-Adresse eingeben.';
    $('#lOk').disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) { $('#lOk').disabled = false; return $('#lErr').textContent = /rate|second/i.test(error.message) ? 'Zu viele Versuche. Bitte einige Minuten warten.' : 'Senden fehlgeschlagen: ' + error.message; }
    $('#root').innerHTML = `<div class="setup"><h1>Mail ist unterwegs</h1><p>Wir haben einen Anmelde-Link an <b>${esc(email)}</b> geschickt. Öffne ihn auf diesem Gerät. Schau auch im Spam-Ordner nach.</p>
      <button class="btn" onclick="location.reload()">Zurück</button></div>`;
  };
}

function wartet(profil) {

    <p>Du bist als <b>${esc(profil.email)}</b> angemeldet. Ein Admin muss dich noch freischalten. Danach diese Seite neu laden.</p>
    <button class="btn primary" onclick="location.reload()">Neu laden</button>

async function abmelden() { if (sb) await sb.auth.signOut(); location.reload(); }

async function startMitSitzung(session) {
  S.api = restApi(async () => { const { data } = await sb.auth.getSession(); return data.session ? data.session.access_token : session.access_token; });
  try {
    const profil = await S.api.meinProfil(session.user.id);
    if (!profil) return wartet({ email: session.user.email });
    S.profil = profil;
    if (profil.rolle === 'wartend') return wartet(profil);
    S.modus = profil.rolle === 'einkauf' ? 'einkauf' : 'admin';
    laden();
  } catch (e) {
    $('#root').innerHTML = `<div class="setup"><h1>Keine Verbindung</h1><p>${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div>`;
  }
}

/* Menü oben rechts */
function menue() {
  const admin = S.profil && S.profil.rolle === 'admin';
  const ov = dialog(`<h2>Menü</h2>
    <p class="sum">Angemeldet als ${esc(S.profil ? S.profil.email : '')} (${esc(S.profil ? S.profil.rolle : '')})</p>
    <div class="opts" style="flex-direction:column;align-items:stretch">
      ${admin ? `<button class="btn" id="mBenutzer">Benutzer verwalten</button>` : ''}
      <button class="btn" id="mAbmelden">Abmelden</button>
    </div><div class="actions"><button class="btn" data-close>Schliessen</button></div>`);
  if (admin) {
    $('#mBenutzer', ov).onclick = () => { ov.remove(); benutzerDialog(); };
  }
  $('#mAbmelden', ov).onclick = abmelden;
}

async function benutzerDialog() {
  let liste;
  try { liste = await S.api.benutzer(); } catch (e) { return fehler(e); }
  const rollen = [['admin', 'Admin'], ['einkauf', 'Einkauf'], ['wartend', 'Gesperrt / wartet']];
  const ov = dialog(`<h2>Benutzer</h2>
    <p class="sum">Neue Personen melden sich selbst mit ihrer E-Mail an und erscheinen hier als «wartet». Gib ihnen dann eine Rolle.</p>
    <div class="card">${liste.map(b => `<div class="row" data-id="${esc(b.id)}"><div class="main"><div class="name">${esc(b.email)}</div>
      <div class="meta">${b.id === S.profil.id ? 'Das bist du' : ''}</div></div>
      ${b.id === S.profil.id ? `<span class="tag">Admin</span>` : `<select class="laden" data-rolle>${rollen.map(([k, t]) => `<option value="${k}" ${b.rolle === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <button class="iconbtn" data-weg aria-label="Entfernen">✕</button>`}</div>`).join('')}</div>
    <div class="actions"><button class="btn" data-close>Fertig</button></div>`);
  ov.querySelectorAll('.row[data-id]').forEach(row => {
    const id = row.dataset.id, sel = $('[data-rolle]', row), weg = $('[data-weg]', row);
    if (sel) sel.onchange = async () => { try { await S.api.benutzerRolle(id, sel.value); toast('Rolle gespeichert.'); } catch (e) { fehler(e); } };
    if (weg) weg.onclick = async () => { try { await S.api.benutzerLoeschen(id); row.remove(); toast('Entfernt. Die Person kann sich neu anmelden und wartet dann wieder auf Freigabe.'); } catch (e) { fehler(e); } };
  });
}

(async function start() {
  store.del(KEY_STORE); store.del('einkauf-app-modus');   // alte Schlüssel-Links aus Version 1
  if (/[?&]demo\b/.test(location.search)) {
    S.modus = /[?&]einkauf\b/.test(location.search) ? 'einkauf' : 'admin';
    S.profil = { id: 'demo', email: 'demo@example.ch', rolle: S.modus === 'einkauf' ? 'einkauf' : 'admin' };
    S.api = demoApi(); return laden();
  }
  if (!window.supabase) {
    $('#root').innerHTML = `<div class="setup"><h1>Keine Verbindung</h1><p>Die App konnte nicht vollständig geladen werden. Bitte Internetverbindung prüfen.</p><button class="btn primary" onclick="location.reload()">Nochmals versuchen</button></div>`;
    return;
  }
  // Fehler aus dem Anmelde-Link (z. B. abgelaufen)
  const hp = new URLSearchParams((location.hash || '').slice(1));
  if (hp.get('error')) {
    history.replaceState(null, '', location.pathname);
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'implicit' } });
    return anmelden(hp.get('error_code') === 'otp_expired' ? 'Der Anmelde-Link ist abgelaufen oder wurde schon benutzt. Bitte einen neuen anfordern.' : 'Anmeldung fehlgeschlagen. Bitte nochmals versuchen.');
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  if (data.session) return startMitSitzung(data.session);
  let gestartet = false;
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && session && !gestartet) { gestartet = true; startMitSitzung(session); } });
  anmelden();
})();
</script>
